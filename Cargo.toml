[workspace]
resolver = "3"
members = ["crates/maxbin-rs", "crates/maxbin-rs-equivalence"]
# The wasm frontend is built standalone by trunk, not by the native workspace
# checks (leptos/web-sys do not compile for the host target). Promote it to a
# member once it depends on the EM core compiled to wasm.
exclude = ["crates/maxbin-rs-vis"]

# Profiles are only honored at the workspace root, so the benchmark profile
# that used to live in the crate manifest moves here.
# Usage: cargo nextest run --cargo-profile bench bench_components -- --ignored
[profile.bench]
inherits = "release"
debug = true # keep symbols for profiling
