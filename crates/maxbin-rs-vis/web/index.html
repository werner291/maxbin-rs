<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>maxbin-rs · EM visualizer (scaffold)</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 15px/1.5 system-ui, sans-serif;
      max-width: 48rem;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    p.sub { margin-top: 0; opacity: 0.7; }
    canvas {
      width: 100%;
      height: 320px;
      margin-top: 1.5rem;
      border: 1px solid currentColor;
      border-radius: 6px;
      opacity: 0.85;
    }
    footer { margin-top: 1.5rem; font-size: 0.85rem; opacity: 0.6; }
  </style>
</head>
<body>
  <h1>maxbin-rs — EM visualizer</h1>
  <p class="sub">Scaffold. Nothing wired yet; the real EM core (compiled to WASM) lands here later.</p>

  <canvas id="stage"></canvas>

  <footer>
    Static placeholder — open this file directly in a browser. No build step yet.
  </footer>

  <script type="module">
    // Minimal "is the canvas alive?" placeholder. No WASM, no deps.
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const resize = () => {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      ctx.font = "14px system-ui, sans-serif";
      ctx.fillStyle = getComputedStyle(document.body).color;
      ctx.textAlign = "center";
      ctx.fillText("EM visualization goes here", canvas.clientWidth / 2, canvas.clientHeight / 2);
    };
    resize();
    window.addEventListener("resize", resize);
  </script>
</body>
</html>
