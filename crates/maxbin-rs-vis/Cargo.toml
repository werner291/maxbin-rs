[package]
name = "maxbin-rs-vis"
version = "0.0.0"
edition = "2024"
publish = false
description = "Browser teaching/visualization frontend for the maxbin-rs EM core (scaffold)."

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
# Pinned to the wasm-bindgen-cli version the Nix devshell provides; trunk
# rejects a crate/CLI mismatch.
wasm-bindgen = "=0.2.114"
console_error_panic_hook = "0.1"
# Fetch the dataset intermediaries (static assets) client-side. No server.
gloo-net = "0.6"
