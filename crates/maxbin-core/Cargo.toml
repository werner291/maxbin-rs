[package]
name = "maxbin-core"
version = "0.4.0"
edition = "2024"
publish = false
description = "Pure, host-agnostic core of maxbin-rs: tetranucleotide distance, k-mer profiling, abundance/FASTA parsing. No OS or external-tool dependencies; compiles to wasm."

[dependencies]
flate2 = "1.1.9"
libm = "0.2"

# The E-step parallelizes over contigs with rayon on native targets. wasm32 has
# no thread pool, so the dependency is dropped there and the E-step runs serially.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"
